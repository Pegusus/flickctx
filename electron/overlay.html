<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flickctx mark</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        background: transparent;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        user-select: none;
      }
      #dim {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 14, 0.42);
        z-index: 1;
      }
      #canvas {
        position: fixed;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hint {
        position: fixed;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(17, 19, 24, 0.92);
        color: #e8eaef;
        font-size: 13px;
        letter-spacing: 0.02em;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }
      #hint kbd {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
      }
      #bounds {
        position: fixed;
        border: 1px dashed rgba(94, 234, 212, 0.7);
        pointer-events: none;
        z-index: 3;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="dim"></div>
    <canvas id="canvas"></canvas>
    <div id="bounds"></div>
    <div id="hint">
      Draw freehand around what you want · release to ask · <kbd>Esc</kbd>
    </div>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const boundsEl = document.getElementById("bounds");
      const PAD = 18;
      const MIN_POINTS = 4;
      const MIN_SPAN = 12;

      let drawing = false;
      let points = []; // {x,y} in client coords
      let screenPoints = []; // {x,y} in screen coords

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redraw();
      }

      function clearInk() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }

      function redraw() {
        clearInk();
        if (points.length < 2) return;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#5eead4";
        ctx.lineWidth = 3.5;
        ctx.shadowColor = "rgba(94, 234, 212, 0.45)";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function updateBoundsPreview() {
        if (points.length < 2) {
          boundsEl.style.display = "none";
          return;
        }
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const p of points) {
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        }
        boundsEl.style.display = "block";
        boundsEl.style.left = minX - PAD + "px";
        boundsEl.style.top = minY - PAD + "px";
        boundsEl.style.width = maxX - minX + PAD * 2 + "px";
        boundsEl.style.height = maxY - minY + PAD * 2 + "px";
      }

      function reset() {
        drawing = false;
        points = [];
        screenPoints = [];
        boundsEl.style.display = "none";
        clearInk();
      }

      function finish() {
        if (screenPoints.length < MIN_POINTS) {
          reset();
          window.flickctx.cancelOverlay();
          return;
        }
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const p of screenPoints) {
          minX = Math.min(minX, p.x);
          minY = Math.min(minY, p.y);
          maxX = Math.max(maxX, p.x);
          maxY = Math.max(maxY, p.y);
        }
        const width = maxX - minX;
        const height = maxY - minY;
        if (width < MIN_SPAN && height < MIN_SPAN) {
          reset();
          window.flickctx.cancelOverlay();
          return;
        }
        const rect = {
          x: minX - PAD,
          y: minY - PAD,
          width: width + PAD * 2,
          height: height + PAD * 2,
          freehand: true,
        };
        // Keep ink visible briefly, then hand off
        window.flickctx.completeOverlay(rect);
        reset();
      }

      window.addEventListener("resize", resize);
      resize();

      window.flickctx.onOverlayReset(reset);

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          reset();
          window.flickctx.cancelOverlay();
        }
      });

      canvas.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        canvas.setPointerCapture(e.pointerId);
        drawing = true;
        points = [{ x: e.clientX, y: e.clientY }];
        screenPoints = [{ x: e.screenX, y: e.screenY }];
        redraw();
        updateBoundsPreview();
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const last = points[points.length - 1];
        const dx = e.clientX - last.x;
        const dy = e.clientY - last.y;
        if (dx * dx + dy * dy < 4) return; // thin the path a bit
        points.push({ x: e.clientX, y: e.clientY });
        screenPoints.push({ x: e.screenX, y: e.screenY });
        redraw();
        updateBoundsPreview();
      });

      function endStroke(e) {
        if (!drawing) return;
        drawing = false;
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch {
          /* ignore */
        }
        finish();
      }

      canvas.addEventListener("pointerup", endStroke);
      canvas.addEventListener("pointercancel", endStroke);
    </script>
  </body>
</html>
