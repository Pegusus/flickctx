<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flickctx</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: #e8eaef;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #chip,
      #bar {
        height: 100%;
        box-sizing: border-box;
        background: #111318;
        border: 1px solid rgba(94, 234, 212, 0.28);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        -webkit-app-region: drag;
      }
      #chip {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
        border-radius: 999px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #chip:hover {
        border-color: rgba(94, 234, 212, 0.55);
      }
      #chip .mark {
        color: #5eead4;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      #chip .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #5eead4;
        flex-shrink: 0;
      }
      #bar {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 12px;
        border-radius: 12px;
      }
      body.expanded #chip {
        display: none;
      }
      body.expanded #bar {
        display: flex;
      }
      #brand {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #brand span {
        color: #5eead4;
      }
      button {
        -webkit-app-region: no-drag;
        border: 1px solid rgba(94, 234, 212, 0.35);
        background: rgba(94, 234, 212, 0.12);
        color: #5eead4;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: rgba(94, 234, 212, 0.6);
      }
      #hint {
        font-size: 10px;
        color: #9aa3b2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      #collapse,
      #quit {
        border-color: rgba(154, 163, 178, 0.35);
        background: transparent;
        color: #9aa3b2;
        padding: 4px 8px;
        font-size: 14px;
        line-height: 1;
      }
      #quit:hover {
        border-color: rgba(251, 113, 133, 0.55);
        color: #fb7185;
      }
    </style>
  </head>
  <body>
    <div id="chip" title="Open Flickctx">
      <span class="dot" aria-hidden="true"></span>
      <span class="mark">Flickctx</span>
    </div>
    <div id="bar">
      <div id="brand">Flick<span>ctx</span></div>
      <button id="mark" type="button">Mark</button>
      <div id="hint">mark anything · ask anything</div>
      <button id="collapse" type="button" title="Collapse to corner">–</button>
      <button id="quit" type="button" title="Quit Flickctx">×</button>
    </div>
    <script>
      const body = document.body;
      const chip = document.getElementById("chip");
      const mark = document.getElementById("mark");
      const collapse = document.getElementById("collapse");
      const quit = document.getElementById("quit");

      function setExpanded(on) {
        body.classList.toggle("expanded", Boolean(on));
      }

      chip.onclick = () => {
        if (window.flickctx?.setLauncherExpanded) {
          window.flickctx.setLauncherExpanded(true);
        } else {
          setExpanded(true);
        }
      };
      collapse.onclick = () => {
        if (window.flickctx?.setLauncherExpanded) {
          window.flickctx.setLauncherExpanded(false);
        } else {
          setExpanded(false);
        }
      };
      mark.onclick = () => window.flickctx.mark();
      quit.onclick = () => window.flickctx.quitApp && window.flickctx.quitApp();

      if (window.flickctx?.onLauncherMode) {
        window.flickctx.onLauncherMode((mode) => {
          setExpanded(mode === "expanded");
        });
      }
    </script>
  </body>
</html>
