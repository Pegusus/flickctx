<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flickctx</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111318;
        color: #e8eaef;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #wrap {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        -webkit-app-region: drag;
      }
      #brand {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #brand span {
        color: #5eead4;
      }
      button {
        -webkit-app-region: no-drag;
        border: 1px solid rgba(94, 234, 212, 0.35);
        background: rgba(94, 234, 212, 0.12);
        color: #5eead4;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      #hint {
        font-size: 10px;
        color: #9aa3b2;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="brand">Flick<span>ctx</span></div>
      <button id="mark">Mark</button>
      <div id="hint">mark anything · ask anything</div>
    </div>
    <script>
      document.getElementById("mark").onclick = () => window.flickctx.mark();
    </script>
  </body>
</html>
