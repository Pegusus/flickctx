<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flickctx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: #12141a;
        font-family: "Outfit", "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #chip,
      #bar {
        height: 100%;
        box-sizing: border-box;
        background: #fff;
        border: 1px solid rgba(232, 93, 4, 0.28);
        box-shadow: 0 8px 24px rgba(18, 20, 26, 0.12);
        -webkit-app-region: drag;
      }
      #chip {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
        border-radius: 999px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #chip:hover {
        border-color: rgba(232, 93, 4, 0.55);
      }
      #chip .mark {
        color: #e85d04;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      #chip .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #e85d04;
        flex-shrink: 0;
      }
      #bar {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 0 8px 0 12px;
        border-radius: 12px;
      }
      body.expanded #chip {
        display: none;
      }
      body.expanded #bar {
        display: flex;
      }
      #brand {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #brand span {
        color: #e85d04;
      }
      button {
        -webkit-app-region: no-drag;
        border: 1px solid rgba(232, 93, 4, 0.35);
        background: #fff1e6;
        color: #c44a00;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: rgba(232, 93, 4, 0.6);
      }
      #route {
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        border-color: #e6e3de;
        background: #f6f5f3;
        color: #12141a;
      }
      #route.has-route {
        border-color: rgba(232, 93, 4, 0.45);
        color: #e85d04;
      }
      #collapse,
      #quit {
        border-color: #e6e3de;
        background: transparent;
        color: #5c6570;
        padding: 4px 8px;
        font-size: 13px;
        line-height: 1;
      }
      #quit:hover {
        border-color: rgba(225, 29, 72, 0.45);
        color: #e11d48;
      }
    </style>
  </head>
  <body>
    <div id="chip" title="Open Flickctx">
      <span class="dot" aria-hidden="true"></span>
      <span class="mark">Flickctx</span>
    </div>
    <div id="bar">
      <div id="brand">Flick<span>ctx</span></div>
      <button id="mark" type="button" title="Mark a screen region">Mark</button>
      <button id="shot" type="button" title="Import display (Shot)">Shot</button>
      <button id="route" type="button" title="Pick Claude Code / OpenCode session">
        Route
      </button>
      <button id="chat" type="button" title="Open chat">Chat</button>
      <button id="collapse" type="button" title="Collapse">–</button>
      <button id="quit" type="button" title="Quit Flickctx">Quit</button>
    </div>
    <script>
      const body = document.body;
      const chip = document.getElementById("chip");
      const mark = document.getElementById("mark");
      const shot = document.getElementById("shot");
      const routeBtn = document.getElementById("route");
      const chat = document.getElementById("chat");
      const collapse = document.getElementById("collapse");
      const quit = document.getElementById("quit");

      function setExpanded(on) {
        body.classList.toggle("expanded", Boolean(on));
      }

      function setRouteLabel(label, hasRoute) {
        routeBtn.textContent = label || "Route";
        routeBtn.classList.toggle("has-route", Boolean(hasRoute));
        routeBtn.title = hasRoute
          ? "Change Claude Code / OpenCode session"
          : "Pick Claude Code / OpenCode session";
      }

      chip.onclick = () => {
        if (window.flickctx?.setLauncherExpanded) {
          window.flickctx.setLauncherExpanded(true);
        } else {
          setExpanded(true);
        }
      };
      collapse.onclick = () => {
        if (window.flickctx?.setLauncherExpanded) {
          window.flickctx.setLauncherExpanded(false);
        } else {
          setExpanded(false);
        }
      };
      mark.onclick = () => window.flickctx.mark();
      shot.onclick = () => window.flickctx.screenshot();
      routeBtn.onclick = () =>
        window.flickctx.openRouteMenu && window.flickctx.openRouteMenu();
      chat.onclick = () =>
        window.flickctx.openChat && window.flickctx.openChat();
      quit.onclick = () => window.flickctx.quitApp && window.flickctx.quitApp();

      if (window.flickctx?.onLauncherMode) {
        window.flickctx.onLauncherMode((mode) => {
          setExpanded(mode === "expanded");
        });
      }
      if (window.flickctx?.onLauncherRoute) {
        window.flickctx.onLauncherRoute((data) => {
          setRouteLabel(data?.label, Boolean(data?.route));
        });
      }
    </script>
  </body>
</html>
