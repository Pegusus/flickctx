<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flickctx</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, "SF Pro Text", "IBM Plex Sans", sans-serif;
        color: #f2f4f8;
        user-select: none;
      }
      #menu {
        margin: 4px;
        padding: 6px;
        border-radius: 12px;
        background: rgba(28, 30, 36, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .item:hover {
        background: rgba(94, 234, 212, 0.16);
      }
      .item .kbd {
        font-size: 11px;
        color: #9aa3b2;
      }
      .sep {
        height: 1px;
        margin: 4px 6px;
        background: rgba(255, 255, 255, 0.08);
      }
      .danger:hover {
        background: rgba(248, 113, 113, 0.16);
      }
      .brand {
        padding: 6px 10px 8px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: #5eead4;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <div class="brand">Flickctx</div>
      <button class="item" data-action="mark" type="button">
        <span>Mark region</span>
        <span class="kbd" id="hotkey">⌘⇧F</span>
      </button>
      <button class="item" data-action="chat" type="button">
        <span>Open chat</span>
      </button>
      <button class="item" data-action="hide-chat" type="button">
        <span>Hide chat</span>
      </button>
      <div class="sep"></div>
      <button class="item" data-action="config" type="button">
        <span>Config</span>
      </button>
      <button class="item" data-action="permission" type="button">
        <span>Screen Recording…</span>
      </button>
      <div class="sep"></div>
      <button class="item danger" data-action="quit" type="button">
        <span>Quit</span>
      </button>
    </div>
    <script>
      document.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.flickctx.trayAction(btn.dataset.action);
        });
      });
      if (window.flickctx?.onTrayMenuMeta) {
        window.flickctx.onTrayMenuMeta((meta) => {
          if (meta?.hotkey) {
            document.getElementById("hotkey").textContent = meta.hotkey;
          }
        });
      }
      window.addEventListener("blur", () => {
        window.flickctx?.trayMenuBlur?.();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.flickctx?.trayMenuBlur?.();
      });
    </script>
  </body>
</html>
