<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flickctx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #111318;
        --panel: #181b22;
        --text: #e8eaef;
        --muted: #9aa3b2;
        --accent: #e85d04;
        --accent-soft: rgba(232, 93, 4, 0.14);
        --accent-ink: #ff7a2e;
        --danger: #fb7185;
        --line: rgba(255, 255, 255, 0.08);
        --user: #1a2430;
        --bot: #151820;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Outfit", "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
      }
      #chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
        background: var(--panel);
        flex-shrink: 0;
      }
      #brand {
        font-weight: 650;
        letter-spacing: 0.04em;
        font-size: 13px;
      }
      #brand span {
        color: var(--accent);
      }
      #actions {
        display: flex;
        align-items: center;
        gap: 10px;
        -webkit-app-region: no-drag;
      }
      #routeStatus {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        max-width: 220px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #routeStatus.has-route {
        color: var(--accent);
      }
      #routeStatus.hidden {
        display: none;
      }
      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: rgba(232, 93, 4, 0.45);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-ink);
        border-color: var(--accent-ink);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #meta {
        padding: 8px 14px;
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      #mark-preview {
        display: none;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        flex-shrink: 0;
      }
      #mark-preview.visible {
        display: block;
      }
      #mark-preview .label {
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      #mark-preview img {
        display: block;
        max-width: 100%;
        max-height: 140px;
        border-radius: 8px;
        border: 1px solid var(--line);
        object-fit: contain;
        background: #000;
      }
      #mark-preview .dims {
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      #chat {
        flex: 1;
        overflow: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        max-width: 100%;
        border-radius: 12px;
        padding: 10px 12px;
        line-height: 1.5;
        font-size: 13.5px;
        border: 1px solid var(--line);
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
        white-space: pre-wrap;
      }
      .msg.assistant {
        align-self: stretch;
        background: var(--bot);
      }
      .msg.system {
        align-self: stretch;
        background: transparent;
        border-style: dashed;
        color: var(--muted);
        font-size: 12.5px;
      }
      .msg.pending {
        color: var(--text);
        font-style: normal;
      }
      .msg.pending .stream-status {
        color: var(--muted);
        font-style: italic;
        font-size: 12.5px;
        margin-bottom: 8px;
      }
      .busy-bar {
        position: relative;
        height: 3px;
        margin: 10px 0 4px;
        border-radius: 999px;
        background: var(--accent-soft);
        overflow: hidden;
      }
      .busy-bar > span {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 36%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        animation: busy-shuttle 1.1s ease-in-out infinite alternate;
      }
      @keyframes busy-shuttle {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(180%);
        }
      }
      .msg.error {
        color: var(--danger);
        border-color: rgba(251, 113, 133, 0.35);
      }
      .role {
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .msg.user .role {
        color: var(--accent-ink);
      }
      details.reasoning {
        margin: 0 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        overflow: hidden;
      }
      details.reasoning > summary {
        cursor: pointer;
        list-style: none;
        padding: 8px 10px;
        font-size: 11px;
        color: var(--accent);
        font-weight: 650;
        user-select: none;
      }
      details.reasoning > summary::-webkit-details-marker {
        display: none;
      }
      details.reasoning > summary::before {
        content: "▸ ";
      }
      details.reasoning[open] > summary::before {
        content: "▾ ";
      }
      details.reasoning .reasoning-body {
        padding: 0 10px 10px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .md h1,
      .md h2,
      .md h3 {
        margin: 0.7em 0 0.3em;
        line-height: 1.25;
        font-weight: 650;
      }
      .md h2 {
        font-size: 1.05em;
        color: var(--accent);
      }
      .md p {
        margin: 0.4em 0;
      }
      .md ul,
      .md ol {
        margin: 0.35em 0 0.5em;
        padding-left: 1.2em;
      }
      .md code {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.92em;
        background: rgba(255, 255, 255, 0.06);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      .md pre {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow: auto;
      }
      .md pre code {
        background: none;
        padding: 0;
      }
      .md strong {
        color: var(--text);
      }
      .md a {
        color: var(--accent);
      }
      .md .table-wrap {
        margin: 0.55em 0;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
      }
      .md table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
        line-height: 1.4;
      }
      .md th,
      .md td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      .md th {
        color: var(--accent-ink);
        font-weight: 650;
        background: var(--accent-soft);
        white-space: nowrap;
      }
      .md tr:last-child td {
        border-bottom: none;
      }
      .md td code {
        white-space: nowrap;
      }
      #composer {
        flex-shrink: 0;
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 14px 12px;
      }
      #composer.hidden {
        display: none;
      }
      #composer label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      #question {
        width: 100%;
        min-height: 56px;
        max-height: 140px;
        resize: vertical;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bot);
        color: var(--text);
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
      }
      #composer-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      #composer-actions button {
        flex: 1 1 calc(33% - 8px);
        min-width: 88px;
      }
      #composer-actions button.primary-action {
        flex: 1 1 100%;
      }

      #reshowHighlights {
        border-color: rgba(232, 93, 4, 0.45);
        color: var(--accent-ink);
      }
      #route-picker {
        display: none;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        flex-shrink: 0;
        max-height: 42vh;
        overflow: auto;
      }
      #route-picker.visible { display: block; }
      #route-picker .label {
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      #route-picker .hint {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 10px;
        line-height: 1.4;
      }
      #route-list { display: flex; flex-direction: column; gap: 6px; }
      .route-item {
        text-align: left; width: 100%; padding: 10px 12px;
        border-radius: 10px; border: 1px solid var(--line);
        background: var(--bot); color: var(--text);
      }
      .route-item:hover { border-color: rgba(232, 93, 4, 0.45); }
      .route-item .top {
        display: flex; justify-content: space-between; gap: 8px;
        font-size: 12px; font-weight: 600;
      }
      .route-item .prov {
        color: var(--accent); font-family: ui-monospace, monospace;
        font-size: 10px; font-weight: 500; text-transform: uppercase;
      }
      .route-item .sub {
        margin-top: 4px; font-size: 11px; color: var(--muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .route-item.provider .top span:first-child { font-size: 13px; }
      .route-back {
        margin-bottom: 8px; padding: 6px 10px; width: auto;
        border-radius: 8px; border: 1px solid var(--line);
        background: transparent; color: var(--muted); font-size: 11px;
      }
      .route-back:hover { color: var(--text); border-color: rgba(232, 93, 4, 0.35); }
      #route-remember {
        display: flex; align-items: center; gap: 8px;
        margin-top: 10px; font-size: 11px; color: var(--muted);
      }
      #route-remember input { accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="chrome">
      <div id="brand">Flick<span>ctx</span></div>
      <div id="actions">
        <span id="routeStatus" class="hidden" aria-live="polite"></span>
        <button id="close" title="Hide chat">Close</button>
      </div>
    </div>
    <div id="meta">Mark a region, then keep chatting about it.</div>
    <div id="mark-preview">
      <div class="label">Marked snippet sent to the model</div>
      <img id="mark-img" alt="Marked region preview" />
      <div class="dims" id="mark-dims"></div>
    </div>
    <div id="route-picker">
      <div class="label" id="route-picker-label">Continue where?</div>
      <p class="hint" id="route-picker-hint">
        First pick Claude Code or OpenCode (uses that tool’s configs — no
        Flickctx API key), then choose a session. Or use Flickctx built-in.
      </p>
      <div id="route-list"></div>
      <label id="route-remember">
        <input type="checkbox" id="rememberRoute" checked />
        Remember this choice for next marks
      </label>
    </div>
    <div id="chat"></div>
    <div id="composer" class="hidden">
      <label for="question">Continue about this mark</label>
      <textarea
        id="question"
        placeholder="Ask a follow-up… (Enter to send, Shift+Enter for newline)"
      ></textarea>
      <div id="composer-actions">
        <button id="askBtn" class="primary primary-action">Send</button>
        <button id="explainBtn">Explain mark</button>
        <button id="clear" title="Clear this chat">Clear</button>
        <button id="copy">Copy answer</button>
        <button id="reshowHighlights" class="hidden">Highlights</button>
        <button id="copyPrompt">Copy prompt</button>
      </div>
    </div>
    <script>
      const chat = document.getElementById("chat");
      const meta = document.getElementById("meta");
      const composer = document.getElementById("composer");
      const questionEl = document.getElementById("question");
      const askBtn = document.getElementById("askBtn");
      const markPreview = document.getElementById("mark-preview");
      const markImg = document.getElementById("mark-img");
      const markDims = document.getElementById("mark-dims");
      const reshowHighlights = document.getElementById("reshowHighlights");
      const routePicker = document.getElementById("route-picker");
      const routeList = document.getElementById("route-list");
      const routePickerLabel = document.getElementById("route-picker-label");
      const routePickerHint = document.getElementById("route-picker-hint");
      const rememberRoute = document.getElementById("rememberRoute");
      const routeStatus = document.getElementById("routeStatus");
      let last = null;
      let pendingImagePath = null;
      let busy = false;
      let messages = []; // {role, text, reasoning?}
      let activeRoute = null;
      let pendingSessions = [];
      let pendingByProvider = { claude: [], opencode: [] };
      let pendingSessionMeta = {};
      let pickerProvider = null; // null | 'claude' | 'opencode'

      function applySessionCatalog(data) {
        pendingSessions = Array.isArray(data?.sessions) ? data.sessions : [];
        pendingByProvider = {
          claude: Array.isArray(data?.byProvider?.claude)
            ? data.byProvider.claude
            : pendingSessions.filter((s) => s.provider === "claude"),
          opencode: Array.isArray(data?.byProvider?.opencode)
            ? data.byProvider.opencode
            : pendingSessions.filter((s) => s.provider === "opencode"),
        };
        pendingSessionMeta = data?.sessionMeta || {
          counts: {
            claude: pendingByProvider.claude.length,
            opencode: pendingByProvider.opencode.length,
          },
          claudeAvailable: true,
          opencodeAvailable: true,
          rememberSessionRoute: data?.rememberSessionRoute,
        };
        if (data?.counts && !data?.sessionMeta) {
          pendingSessionMeta.counts = data.counts;
        }
        if (typeof data?.claudeAvailable === "boolean") {
          pendingSessionMeta.claudeAvailable = data.claudeAvailable;
        }
        if (typeof data?.opencodeAvailable === "boolean") {
          pendingSessionMeta.opencodeAvailable = data.opencodeAvailable;
        }
      }

      function sessionsFor(provider) {
        const list = pendingByProvider?.[provider];
        if (Array.isArray(list) && list.length) return list;
        return pendingSessions.filter((s) => s.provider === provider);
      }

      function setRouteStatus(route) {
        activeRoute = route || null;
        if (!route) {
          routeStatus.classList.add("hidden");
          routeStatus.textContent = "";
          routeStatus.classList.remove("has-route");
          return;
        }
        routeStatus.classList.remove("hidden");
        routeStatus.classList.add("has-route");
        routeStatus.textContent =
          route.provider === "flickctx"
            ? "Flickctx built-in"
            : (route.provider === "claude" ? "Claude Code" : "OpenCode") +
              " · " +
              String(route.title || route.id || "").slice(0, 36);
      }

      let hydratedRouteKey = "";
      const HISTORY_PAGE_SIZE = 12;
      const SCROLL_LOAD_THRESHOLD = 56;
      let sessionHistoryHasMore = false;
      let sessionHistoryNextBefore = 0;
      let sessionHistoryLoading = false;

      function routeHistoryKey(route) {
        if (!route) return "";
        return [route.provider, route.id || "", route.sessionFile || ""].join(
          ":"
        );
      }

      function historyScrollBanner(route, historyLen, hasMore) {
        if (hasMore) return "Scroll up for earlier messages";
        if (!historyLen) return "";
        return `Loaded ${historyLen} prior message${
          historyLen === 1 ? "" : "s"
        } from ${route.provider === "claude" ? "Claude Code" : "OpenCode"} · ${route.title || route.id}.`;
      }

      async function loadOlderSessionHistory() {
        if (
          sessionHistoryLoading ||
          !sessionHistoryHasMore ||
          !activeRoute ||
          activeRoute.provider === "flickctx"
        ) {
          return;
        }
        if (!window.flickctx.loadSessionHistory) return;
        sessionHistoryLoading = true;
        const prevScrollHeight = chat.scrollHeight;
        const prevScrollTop = chat.scrollTop;
        try {
          const data = await window.flickctx.loadSessionHistory(activeRoute, {
            limit: HISTORY_PAGE_SIZE,
            before: sessionHistoryNextBefore,
          });
          const older = Array.isArray(data?.messages) ? data.messages : [];
          sessionHistoryHasMore = Boolean(data?.hasMore);
          sessionHistoryNextBefore =
            typeof data?.nextBefore === "number" ? data.nextBefore : 0;
          if (!older.length) return;
          const sysIdx = messages.findIndex((m) => m.role === "system");
          const insertAt = sysIdx >= 0 ? sysIdx + 1 : 0;
          messages.splice(insertAt, 0, ...older);
          if (sysIdx >= 0) {
            const loaded =
              (typeof data?.total === "number" ? data.total : 0) ||
              messages.filter((m) => m.role === "user" || m.role === "assistant")
                .length;
            messages[sysIdx].text = historyScrollBanner(
              activeRoute,
              loaded,
              sessionHistoryHasMore
            );
          }
          renderChat({
            preserveScroll: true,
            prevScrollHeight,
            prevScrollTop,
          });
        } catch {
          /* ignore */
        } finally {
          sessionHistoryLoading = false;
        }
      }

      async function hydrateSessionHistory(route, options = {}) {
        const key = routeHistoryKey(route);
        if (!key || key === hydratedRouteKey) return;
        if (!route || route.provider === "flickctx") {
          hydratedRouteKey = key;
          sessionHistoryHasMore = false;
          sessionHistoryNextBefore = 0;
          return;
        }
        const isNew = Boolean(route.isNew) || route.id === "new" || !route.id;
        if (isNew) {
          hydratedRouteKey = key;
          sessionHistoryHasMore = false;
          sessionHistoryNextBefore = 0;
          return;
        }
        if (!window.flickctx.loadSessionHistory) {
          hydratedRouteKey = key;
          sessionHistoryHasMore = false;
          sessionHistoryNextBefore = 0;
          return;
        }
        try {
          const data = await window.flickctx.loadSessionHistory(route, {
            limit: HISTORY_PAGE_SIZE,
          });
          const history = Array.isArray(data?.messages) ? data.messages : [];
          sessionHistoryHasMore = Boolean(data?.hasMore);
          sessionHistoryNextBefore =
            typeof data?.nextBefore === "number" ? data.nextBefore : 0;
          hydratedRouteKey = key;
          if (!history.length) return;
          const banner =
            options.systemMessage ||
            historyScrollBanner(route, history.length, sessionHistoryHasMore);
          const keep = messages.filter(
            (m) => m.pending || (m.role === "user" && options.keepLocal)
          );
          messages = banner
            ? [{ role: "system", text: banner }, ...history, ...keep]
            : [...history, ...keep];
          renderChat();
        } catch {
          hydratedRouteKey = key;
          sessionHistoryHasMore = false;
          sessionHistoryNextBefore = 0;
        }
      }

      chat.addEventListener("scroll", () => {
        if (chat.scrollTop <= SCROLL_LOAD_THRESHOLD) {
          void loadOlderSessionHistory();
        }
      });

      function hideRoutePicker() {
        routePicker.classList.remove("visible");
        pickerProvider = null;
      }

      function shortHome(dir) {
        return dir ? String(dir).replace(/^\/Users\/[^/]+/, "~") : "";
      }

      function renderProviderStep() {
        pickerProvider = null;
        routePickerLabel.textContent = "Continue where?";
        routePickerHint.textContent =
          "First pick Claude Code or OpenCode, then a session. Or use Flickctx built-in.";
        routeList.innerHTML = "";

        const counts = pendingSessionMeta.counts || {};
        const claudeCount = Math.max(
          typeof counts.claude === "number" ? counts.claude : 0,
          sessionsFor("claude").length
        );
        const opencodeCount = Math.max(
          typeof counts.opencode === "number" ? counts.opencode : 0,
          sessionsFor("opencode").length
        );
        const claudeOk = pendingSessionMeta.claudeAvailable !== false;
        const opencodeOk = pendingSessionMeta.opencodeAvailable !== false;

        const providers = [
          {
            id: "claude",
            title: "Claude Code",
            prov: "claude",
            available: claudeOk,
            count: claudeCount,
            empty: "No Claude Code sessions found on this machine yet.",
            sub: (n) =>
              n
                ? n + " saved session" + (n === 1 ? "" : "s") + " · running or not"
                : "No saved sessions on disk yet · start one in Claude Code",
          },
          {
            id: "opencode",
            title: "OpenCode",
            prov: "opencode",
            available: opencodeOk,
            count: opencodeCount,
            empty: "No OpenCode sessions found on this machine yet.",
            sub: (n) =>
              n
                ? n + " saved session" + (n === 1 ? "" : "s") + " · running or not"
                : "No saved sessions on disk yet · start one in OpenCode",
          },
        ];

        for (const p of providers) {
          const btn = document.createElement("button");
          btn.className = "route-item provider";
          // Allow opening even with zero saved sessions — user can create new.
          btn.disabled = !p.available;
          btn.innerHTML =
            `<div class="top"><span>${p.title}</span><span class="prov">${p.prov}</span></div>` +
            `<div class="sub">${escapeHtml(
              !p.available
                ? p.id === "claude"
                  ? "claude CLI not detected — install Claude Code first"
                  : "opencode CLI not detected — install OpenCode first"
                : p.sub(p.count)
            )}</div>`;
          btn.onclick = () => {
            void renderSessionStep(p.id);
          };
          routeList.appendChild(btn);
        }

        const builtIn = document.createElement("button");
        builtIn.className = "route-item provider";
        builtIn.innerHTML =
          `<div class="top"><span>Flickctx built-in</span><span class="prov">flickctx</span></div>` +
          `<div class="sub">Needs API key / Claude login · vision agent in this window</div>`;
        builtIn.onclick = () => pickRoute({ provider: "flickctx" });
        routeList.appendChild(builtIn);
      }

      async function renderSessionStep(provider) {
        pickerProvider = provider;
        const label = provider === "claude" ? "Claude Code" : "OpenCode";
        const article = provider === "opencode" ? "an" : "a";
        routePickerLabel.textContent =
          "Pick " + article + " " + label + " session";
        routePickerHint.textContent =
          "Saved sessions work even if that chat is not open. Uses that tool’s configs — no Flickctx API key.";
        routeList.innerHTML = "";

        const back = document.createElement("button");
        back.className = "route-back";
        back.type = "button";
        back.textContent = "← Back to Claude / OpenCode";
        back.onclick = () => renderProviderStep();
        routeList.appendChild(back);

        const loading = document.createElement("div");
        loading.className = "hint";
        loading.textContent = "Loading saved sessions…";
        routeList.appendChild(loading);

        try {
          if (window.flickctx.listSessions) {
            const fresh = await window.flickctx.listSessions();
            applySessionCatalog(fresh);
          }
        } catch {
          /* keep cached catalog */
        }

        // Rebuild after refresh (keep back button)
        while (routeList.childNodes.length > 1) {
          routeList.removeChild(routeList.lastChild);
        }

        const newBtn = document.createElement("button");
        newBtn.className = "route-item provider";
        newBtn.innerHTML =
          `<div class="top"><span>+ New ${label} session</span><span class="prov">new</span></div>` +
          `<div class="sub">Start a fresh chat in ${label} from this mark — then keep talking here</div>`;
        newBtn.onclick = () =>
          pickRoute({
            provider,
            id: "new",
            isNew: true,
            title: "New " + label + " session",
            directory: "",
          });
        routeList.appendChild(newBtn);

        const sessions = sessionsFor(provider);
        if (!sessions.length) {
          const empty = document.createElement("div");
          empty.className = "hint";
          empty.textContent =
            "No saved " +
            label +
            " sessions yet. Use + New above, or open " +
            label +
            " once and come back to resume.";
          routeList.appendChild(empty);
          return;
        }

        for (const s of sessions) {
          const btn = document.createElement("button");
          btn.className = "route-item";
          const dir = shortHome(s.directory);
          const sub = [dir, s.preview].filter(Boolean).join(" · ");
          btn.innerHTML =
            `<div class="top"><span>${escapeHtml(s.title || s.id)}</span><span class="prov">${provider}</span></div>` +
            (sub ? `<div class="sub">${escapeHtml(sub)}</div>` : "");
          btn.onclick = () => pickRoute(s);
          routeList.appendChild(btn);
        }
      }

      function showRoutePicker(data) {
        applySessionCatalog(data || {});
        rememberRoute.checked =
          pendingSessionMeta.rememberSessionRoute !== false;
        renderProviderStep();
        routePicker.classList.add("visible");
        composer.classList.add("hidden");
      }

      async function pickRoute(session) {
        if (busy) return;
        const remember = Boolean(rememberRoute.checked);
        const payload =
          session.provider === "flickctx"
            ? { provider: "flickctx", remember }
            : {
                provider: session.provider,
                id: session.id || "new",
                isNew: Boolean(session.isNew) || session.id === "new",
                title: session.title,
                directory: session.directory || "",
                sessionFile: session.sessionFile || "",
                remember,
              };
        const res = await window.flickctx.setRoute(payload);
        setRouteStatus(res?.route || payload);
        hideRoutePicker();
        composer.classList.remove("hidden");
        const route = activeRoute || res?.route || payload;
        const isNew = Boolean(route.isNew) || route.id === "new";
        const sysText =
          route.provider === "flickctx"
            ? "Using Flickctx built-in. Ask about the marked snippet."
            : isNew
              ? `New ${route.provider === "claude" ? "Claude Code" : "OpenCode"} session. Ask anything — the session is created on first send (no Flickctx API key).`
              : `Routing into ${route.provider} · ${route.title || route.id}. Uses that session’s configs — no Flickctx API key required.`;
        messages = [{ role: "system", text: sysText }];
        renderChat();
        await hydrateSessionHistory(route, { systemMessage: sysText });
        meta.textContent =
          route.provider === "flickctx"
            ? "Route · Flickctx built-in"
            : isNew
              ? `Route · new ${route.provider} session`
              : `Route · ${route.provider} · ${route.title || route.id}`;
        questionEl.focus();
      }

      function showMarkPreview(data) {
        if (data?.previewDataUrl) {
          markImg.src = data.previewDataUrl;
          markPreview.classList.add("visible");
          const bits = [];
          if (data.width && data.height) bits.push(data.width + "×" + data.height);
          if (data.bytes) bits.push(Math.round(data.bytes / 1024) + " KB");
          if (data.imageBytes) bits.push(Math.round(data.imageBytes / 1024) + " KB");
          bits.push(
            activeRoute?.provider === "flickctx" || !activeRoute
              ? "Flickctx"
              : activeRoute.provider + " session"
          );
          markDims.textContent = bits.join(" · ");
        } else {
          markPreview.classList.remove("visible");
          markImg.removeAttribute("src");
          markDims.textContent = "";
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderMarkdown(md) {
        if (!md) return "";
        let text = String(md).replace(/\r\n/g, "\n");
        const blocks = [];
        text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
          const i = blocks.length;
          blocks.push(
            `<pre><code>${escapeHtml(code.replace(/^\n/, ""))}</code></pre>`
          );
          return `\n%%BLOCK${i}%%\n`;
        });
        const lines = text.split("\n");
        const out = [];
        let listType = null;
        function closeList() {
          if (listType) {
            out.push(listType === "ol" ? "</ol>" : "</ul>");
            listType = null;
          }
        }
        function inlineFormat(s) {
          let t = escapeHtml(s);
          t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
          t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          t = t.replace(/(^|[^\*])\*([^*]+)\*/g, "$1<em>$2</em>");
          t = t.replace(
            /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
            '<a href="$2" target="_blank" rel="noreferrer">$1</a>'
          );
          return t;
        }
        function isTableSep(line) {
          const t = String(line || "").trim();
          if (!t || !/-/.test(t)) return false;
          // | --- | :---: | ---: |
          return /^\|?(\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?\s*$/.test(t);
        }
        function isTableRow(line) {
          const t = String(line || "").trim();
          if (!t || isTableSep(t)) return false;
          return t.includes("|");
        }
        function splitCells(line) {
          let t = String(line || "").trim();
          if (t.startsWith("|")) t = t.slice(1);
          if (t.endsWith("|")) t = t.slice(0, -1);
          return t.split("|").map((c) => c.trim());
        }
        function renderTable(headerLine, bodyLines) {
          const headers = splitCells(headerLine);
          let html = '<div class="table-wrap"><table><thead><tr>';
          for (const h of headers) html += `<th>${inlineFormat(h)}</th>`;
          html += "</tr></thead><tbody>";
          for (const row of bodyLines) {
            const cells = splitCells(row);
            html += "<tr>";
            for (let i = 0; i < headers.length; i++) {
              html += `<td>${inlineFormat(cells[i] || "")}</td>`;
            }
            html += "</tr>";
          }
          html += "</tbody></table></div>";
          return html;
        }
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const blockMatch = line.match(/^%%BLOCK(\d+)%%$/);
          if (blockMatch) {
            closeList();
            out.push(blocks[Number(blockMatch[1])]);
            continue;
          }
          if (/^\s*$/.test(line)) {
            closeList();
            continue;
          }
          // GFM pipe tables: header + separator + rows
          if (
            isTableRow(line) &&
            i + 1 < lines.length &&
            isTableSep(lines[i + 1])
          ) {
            closeList();
            const header = line;
            i += 2; // skip separator
            const body = [];
            while (i < lines.length && isTableRow(lines[i])) {
              body.push(lines[i]);
              i += 1;
            }
            i -= 1; // outer loop will advance
            out.push(renderTable(header, body));
            continue;
          }
          const heading = line.match(/^(#{1,3})\s+(.*)$/);
          if (heading) {
            closeList();
            const level = heading[1].length;
            out.push(`<h${level}>${inlineFormat(heading[2])}</h${level}>`);
            continue;
          }
          const ul = line.match(/^\s*[-*]\s+(.*)$/);
          if (ul) {
            if (listType !== "ul") {
              closeList();
              out.push("<ul>");
              listType = "ul";
            }
            out.push(`<li>${inlineFormat(ul[1])}</li>`);
            continue;
          }
          const ol = line.match(/^\s*\d+\.\s+(.*)$/);
          if (ol) {
            if (listType !== "ol") {
              closeList();
              out.push("<ol>");
              listType = "ol";
            }
            out.push(`<li>${inlineFormat(ol[1])}</li>`);
            continue;
          }
          closeList();
          out.push(`<p>${inlineFormat(line)}</p>`);
        }
        closeList();
        return out.join("\n");
      }

      function renderChat(scrollOpts = {}) {
        const prevScrollHeight = scrollOpts.prevScrollHeight;
        const prevScrollTop = scrollOpts.prevScrollTop;
        chat.innerHTML = "";
        for (const m of messages) {
          const el = document.createElement("div");
          el.className = "msg " + m.role + (m.pending ? " pending" : "") + (m.error ? " error" : "");
          if (m.role === "system") {
            el.textContent = m.text;
          } else if (m.role === "user") {
            el.innerHTML =
              `<div class="role">You</div>` + escapeHtml(m.text);
          } else {
            let html = `<div class="role">${
              activeRoute && activeRoute.provider !== "flickctx"
                ? escapeHtml(
                    (activeRoute.provider === "claude" ? "Claude Code" : "OpenCode") +
                      " · " +
                      String(activeRoute.title || activeRoute.id || "").slice(0, 40)
                  )
                : "Flickctx"
            }</div>`;
            if (m.reasoning && String(m.reasoning).trim()) {
              html +=
                `<details class="reasoning"${m.pending ? " open" : ""}>` +
                `<summary>Reasoning</summary>` +
                `<div class="reasoning-body">${escapeHtml(
                  String(m.reasoning).trim()
                )}</div>` +
                `</details>`;
            }
            if (m.pending) {
              html += `<div class="busy-bar" aria-hidden="true"><span></span></div>`;
              if (m.status) {
                html += `<div class="stream-status">${escapeHtml(m.status)}</div>`;
              }
              if (m.text) {
                html += `<div class="md">${renderMarkdown(m.text)}</div>`;
              }
              if (!m.text && !m.status) {
                html += `<div class="stream-status">Working…</div>`;
              }
            } else if (m.error) {
              html += escapeHtml(m.text || "Error");
            } else {
              html += `<div class="md">${renderMarkdown(m.text || "")}</div>`;
            }
            el.innerHTML = html;
          }
          chat.appendChild(el);
        }
        if (scrollOpts.preserveScroll) {
          chat.scrollTop =
            prevScrollTop + (chat.scrollHeight - prevScrollHeight);
        } else {
          chat.scrollTop = chat.scrollHeight;
        }
      }

      function setBusy(isBusy) {
        busy = isBusy;
        askBtn.disabled = isBusy;
        questionEl.disabled = isBusy;
      }

      function submit(question) {
        if (!pendingImagePath || busy) return;
        if (!activeRoute) {
          messages = [{
            role: "system",
            text: "Pick an OpenCode / Claude Code session (or Flickctx built-in) first.",
          }];
          renderChat();
          routePicker.classList.add("visible");
          return;
        }
        const q = (question || "").trim();
        if (q) {
          messages.push({ role: "user", text: q });
        } else {
          messages.push({ role: "user", text: "Explain what I marked." });
        }
        messages.push({
          role: "assistant",
          text: "",
          reasoning: "",
          status:
            activeRoute.provider === "flickctx"
              ? "Thinking…"
              : activeRoute.provider === "claude"
                ? "Claude Code · starting…"
                : "OpenCode · starting…",
          pending: true,
        });
        renderChat();
        questionEl.value = "";
        setBusy(true);
        window.flickctx.askAboutMark({
          imagePath: pendingImagePath,
          question: q,
        });
      }

      document.getElementById("close").onclick = () =>
        window.flickctx.closeResult();
      document.getElementById("clear").onclick = () => {
        if (busy) return;
        messages = pendingImagePath
          ? [
              {
                role: "system",
                text: "Chat cleared. Same mark is still attached — ask anything about it.",
              },
            ]
          : [];
        last = null;
        hydratedRouteKey = "";
        reshowHighlights.classList.add("hidden");
        renderChat();
        window.flickctx.clearChat && window.flickctx.clearChat();
        questionEl.focus();
      };
      document.getElementById("copy").onclick = () => {
        if (last?.explanation) window.flickctx.copyText(last.explanation);
      };
      reshowHighlights.onclick = () => {
        window.flickctx.showHighlightsAgain &&
          window.flickctx.showHighlightsAgain();
      };
      document.getElementById("copyPrompt").onclick = () => {
        if (last?.followUpPrompt)
          window.flickctx.copyText(last.followUpPrompt);
      };
      askBtn.onclick = () => submit(questionEl.value);
      document.getElementById("explainBtn").onclick = () => submit("");
      questionEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          submit(questionEl.value);
        }
      });

      window.flickctx.onResultReadyAsk(async (data) => {
        last = null;
        pendingImagePath = data.imagePath;
        setBusy(false);
        reshowHighlights.classList.add("hidden");
        showMarkPreview(data);
        if (data.needsRoutePick || !data.route) {
          setRouteStatus(null);
          hydratedRouteKey = "";
          showRoutePicker(data);
          messages = [{
            role: "system",
            text: "Region captured. First choose Claude Code or OpenCode, then a session (uses that tool’s configs — no Flickctx API key), or Flickctx built-in.",
          }];
          renderChat();
          meta.textContent = "Pick Claude Code or OpenCode";
        } else {
          setRouteStatus(data.route);
          hideRoutePicker();
          composer.classList.remove("hidden");
          const isScreenshot =
            data.captureMode === "screenshot" || data.captureMode === "system";
          const routeLabel =
            data.route.provider === "flickctx"
              ? "Flickctx built-in"
              : `${data.route.provider === "claude" ? "Claude Code" : data.route.provider === "opencode" ? "OpenCode" : data.route.provider} · ${data.route.title || data.route.id}`;
          const sysText = isScreenshot
            ? `Screenshot ready — routed to ${routeLabel}. Ask about what’s on screen.`
            : data.route.provider === "flickctx"
              ? "Region captured. Using Flickctx built-in — ask about the snippet."
              : `Region captured. Continuing in ${data.route.provider} · ${data.route.title || data.route.id}.`;
          messages = [{ role: "system", text: sysText }];
          renderChat();
          await hydrateSessionHistory(data.route, { systemMessage: sysText });
          const metaBits = [];
          metaBits.push(
            data.route.provider === "flickctx"
              ? "Flickctx"
              : data.route.provider + " · " + (data.route.title || data.route.id)
          );
          if (data.frontmostLabel) metaBits.push(data.frontmostLabel);
          if (data.hasContextImage) metaBits.push("full-screen context");
          meta.textContent = isScreenshot
            ? `Screenshot ready · routed to ${routeLabel}` +
              (data.frontmostLabel ? " · " + data.frontmostLabel : "")
            : "Mark attached · " + metaBits.join(" · ");
          questionEl.value = "";
          questionEl.focus();
        }
      });

      window.flickctx.onResultPickRoute((data) => {
        setRouteStatus(null);
        hydratedRouteKey = "";
        showRoutePicker(data || {});
        messages.push({
          role: "system",
          text: "Pick Claude Code or OpenCode, then a session for this mark.",
        });
        meta.textContent = "Pick Claude Code or OpenCode";
        renderChat();
      });

      if (window.flickctx.onResultRouteSet) {
        window.flickctx.onResultRouteSet(async (data) => {
          if (!data?.route) return;
          setRouteStatus(data.route);
          hideRoutePicker();
          composer.classList.remove("hidden");
          const sysText =
            data.route.isNew || data.route.id === "new"
              ? `New ${data.route.provider === "claude" ? "Claude Code" : "OpenCode"} session ready. Mark something or ask to start chatting.`
              : `Routed to ${data.route.provider} · ${data.route.title || data.route.id}.`;
          messages = [{ role: "system", text: sysText }];
          renderChat();
          await hydrateSessionHistory(data.route, { systemMessage: sysText });
          meta.textContent =
            data.route.isNew || data.route.id === "new"
              ? `Route · new ${data.route.provider} session`
              : `Route · ${data.route.provider} · ${data.route.title || data.route.id}`;
        });
      }

      window.flickctx.onResultLoading((data) => {
        // If we already added a pending bubble via submit(), keep chat.
        // If loading without local pending (edge), add one.
        if (!messages.some((m) => m.pending)) {
          messages.push({
            role: "assistant",
            text: "",
            reasoning: "",
            status: "Thinking…",
            pending: true,
          });
          renderChat();
        }
        setBusy(true);
        composer.classList.remove("hidden");
        if (data?.projectPath) {
          meta.textContent = "Mark attached · " + data.projectPath;
        }
      });

      let streamRaf = 0;
      window.flickctx.onResultStream((data) => {
        const idx = messages.map((m) => m.pending).lastIndexOf(true);
        if (idx < 0) return;
        const cur = messages[idx];
        if (typeof data?.text === "string") cur.text = data.text;
        if (typeof data?.reasoning === "string") cur.reasoning = data.reasoning;
        if (typeof data?.status === "string") cur.status = data.status;
        if (data?.kind === "text" && data.text) cur.status = data.status || "";
        // Coalesce rapid stream frames into one paint.
        if (streamRaf) return;
        streamRaf = requestAnimationFrame(() => {
          streamRaf = 0;
          renderChat();
        });
      });

      window.flickctx.onResultDone((data) => {
        last = data;
        pendingImagePath = data.imagePath || pendingImagePath;
        if (data.previewDataUrl) showMarkPreview(data);
        // Replace pending assistant bubble
        const idx = messages.map((m) => m.pending).lastIndexOf(true);
        const assistantMsg = {
          role: "assistant",
          text: data.explanation || "(empty)",
          reasoning: data.reasoning || "",
        };
        if (idx >= 0) messages[idx] = assistantMsg;
        else messages.push(assistantMsg);
        renderChat();
        const bits = [];
        if (data.route?.provider && data.route.provider !== "flickctx") {
          setRouteStatus(data.route);
          activeRoute = { ...activeRoute, ...data.route, isNew: false };
          bits.push(data.route.provider);
          bits.push(String(data.route.title || data.route.id || "").slice(0, 32));
        } else {
          bits.push("vision");
        }
        if (data.frontmostLabel) bits.push(data.frontmostLabel);
        if (data.hasContextImage) bits.push("+context");
        const vp = data.contextMeta?.visionPrimary;
        if (vp?.mediaType) bits.push(vp.mediaType.replace("image/", ""));
        if (vp?.width && vp?.height) bits.push(vp.width + "×" + vp.height);
        else if (data.width && data.height) bits.push(data.width + "×" + data.height);
        if (vp?.bytes) bits.push(Math.round(vp.bytes / 1024) + "KB");
        else if (data.imageBytes) bits.push(Math.round(data.imageBytes / 1024) + "KB");
        if (data.contextMeta) {
          const m = data.contextMeta;
          bits.push(`repos:${m.localRepos ?? 0}`);
        }
        if (data.model) bits.push(data.model);
        if (data.thinkingEnabled) bits.push("thinking");
        if (data.highlightCount) bits.push(`highlights:${data.highlightCount}`);
        meta.textContent = bits.join(" · ");
        if (data.highlightCount > 0) reshowHighlights.classList.remove("hidden");
        else reshowHighlights.classList.add("hidden");
        composer.classList.remove("hidden");
        setBusy(false);
        questionEl.focus();
      });

      window.flickctx.onResultError((data) => {
        const idx = messages.map((m) => m.pending).lastIndexOf(true);
        const errMsg = {
          role: "assistant",
          text: data?.message || "Something went wrong.",
          error: true,
        };
        if (idx >= 0) messages[idx] = errMsg;
        else messages.push(errMsg);
        renderChat();
        composer.classList.remove("hidden");
        setBusy(false);
        questionEl.focus();
      });

      // empty state
      messages = [
        {
          role: "system",
          text: "Click Mark (or ⌘⇧F / Ctrl+Shift+F), draw freehand, then chat about the snippet.",
        },
      ];
      renderChat();
    </script>
  </body>
</html>
